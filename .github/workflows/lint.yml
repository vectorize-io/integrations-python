name: Python lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint_langchain:
    name: Lint LangChain - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./langchain
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "langchain/uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          # Use the matrix version. Reading pyproject's requires-python made
          # setup-python pick the newest release (3.14), which pyo3-ffi 0.22
          # cannot build against, so the matrix was never actually tested.
          python-version: ${{ matrix.python-version }}
      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-langchain-${{ hashFiles('langchain/uv.lock') }}
          restore-keys: |
            uv-langchain-${{ hashFiles('langchain/uv.lock') }}
            uv-${{ runner.os }}
      - name: Install the project
        run: uv sync --dev
      - name: Run ruff format check
        run: uv run ruff format --check
      - name: Run ruff check
        run: uv run ruff check
      - name: Run mypy
        run: uv run mypy .
      - name: Minimize uv cache
        run: uv cache prune --ci
